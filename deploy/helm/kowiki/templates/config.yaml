apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "kowiki.labels" . | nindent 4 }}
data:
  KOWIKI_KAFKA_BOOTSTRAP: {{ include "kowiki.kafka" . | quote }}
  KOWIKI_TOPIC_PREFIX: {{ .Values.topicPrefix | quote }}
  KOWIKI_GROUP_PREFIX: {{ .Values.groupPrefix | quote }}
  KOWIKI_QDRANT_URL: {{ .Values.qdrant.url | quote }}
  KOWIKI_COLLECTION: {{ .Values.collection.alias | quote }}
  KOWIKI_COLLECTION_VERSION: {{ .Values.collection.version | quote }}
  KOWIKI_BLOB_URL: {{ printf "s3://%s" .Values.storage.bucket | quote }}
  KOWIKI_S3_ENDPOINT: {{ include "kowiki.s3Endpoint" . | quote }}
  KOWIKI_EMBED_BASE_URL: {{ include "kowiki.embeddingUrl" . | quote }}
  KOWIKI_EMBED_MODEL: {{ .Values.embedding.model | quote }}
  KOWIKI_EMBED_DIM: {{ .Values.embedding.dim | quote }}
  {{- range $key, $value := .Values.extraEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  labels:
    {{- include "kowiki.labels" . | nindent 4 }}
type: Opaque
stringData:
  KOWIKI_S3_ACCESS_KEY: {{ .Values.storage.accessKey | quote }}
  KOWIKI_S3_SECRET_KEY: {{ .Values.storage.secretKey | quote }}
